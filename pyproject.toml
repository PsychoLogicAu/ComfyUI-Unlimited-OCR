[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-unlimited-ocr"
version = "1.0.0"
description = "ComfyUI custom nodes for Baidu Unlimited-OCR model"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.57.1",
    "Pillow>=11.1.0",
    "numpy>=1.25.0",
]

[tool.comfy]
publisher = "PsychoLogicAu"
type = "node_pack"
nodes_folder = "."

[tool.setuptools]
py-modules = ["unlimited_ocr_nodes", "unlimited_ocr_worker"]
